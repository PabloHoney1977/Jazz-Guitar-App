<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#0a0618"/>
<meta name="description" content="Fretfire — learn real guitar by playing a game."/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Fretfire"/>
<title>Fretfire</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg"/>
<link rel="apple-touch-icon" href="icons/icon-180.png"/>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<!-- Shown before the app mounts, and swapped for a real error state if the
     scripts never run. A blank dark page is indistinguishable from a broken
     one, and "it just showed a black screen" is the bug report you can never
     debug. Never delete this. -->
<div id="boot">
  <div>
    <div class="mark">FRETFIRE</div>
    <p class="muted" style="margin-top:10px" id="boot-msg">tuning up…</p>
    <button class="btn" id="boot-reload" style="margin-top:18px;display:none">Reload</button>
  </div>
</div>

<div id="app">
  <section class="screen" id="screen-intro"></section>
  <section class="screen" id="screen-home"></section>
  <section class="screen" id="screen-songs"></section>
  <section class="screen" id="screen-lesson"></section>

  <section class="screen" id="screen-play">
    <canvas id="stage"></canvas>
    <button class="pausebtn" id="btn-pause" aria-label="Pause">❚❚</button>
    <div class="hud">
      <div>
        <div class="score" id="hud-score">0</div>
        <div class="acc" id="hud-acc">100%</div>
      </div>
      <div style="text-align:right">
        <div class="mult" id="hud-mult">×1</div>
        <div class="acc" id="hud-chord"></div>
      </div>
    </div>
    <div class="combo" id="hud-combo" hidden><b>0</b><span>STREAK</span></div>
    <div class="meter"><i id="hud-fire" style="height:0"></i></div>
    <div class="healthbar"><i id="hud-health" style="height:65%"></i></div>
    <div class="lanes" id="lane-pads"></div>
    <div class="strumbar" id="strum-bar" hidden>STRUM</div>
    <div class="miclive" id="mic-live" hidden>🎸 LISTENING</div>
  </section>

  <section class="screen" id="screen-results"></section>
  <section class="screen" id="screen-tuner"></section>
  <section class="screen" id="screen-settings"></section>
</div>

<script type="module" src="js/main.js"></script>
<script>
// Watchdog: if the module never boots (syntax error, blocked script, a browser
// too old for modules), say so out loud instead of sitting on a dark screen.
(function () {
  var done = false;
  window.addEventListener('fretfire:ready', function () { done = true; });
  function fail(why) {
    if (done) return;
    var m = document.getElementById('boot-msg');
    var b = document.getElementById('boot-reload');
    if (m) m.textContent = why;
    if (b) { b.style.display = 'inline-flex'; b.onclick = function () { location.reload(); }; }
  }
  window.addEventListener('error', function () { fail("Something didn't load properly."); });
  setTimeout(function () { fail("This is taking longer than it should."); }, 5000);
})();
</script>
</body>
</html>
