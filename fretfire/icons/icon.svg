<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b33"/><stop offset="1" stop-color="#07040f"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5c7a"/><stop offset="0.55" stop-color="#ff9f45"/><stop offset="1" stop-color="#ffd93d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the highway, converging toward the horizon -->
  <path d="M198 104 L314 104 L400 424 L112 424 Z" fill="#170c2e" opacity="0.9"/>
  <g stroke="#4a3080" stroke-width="3">
    <path d="M214 104 L152 424"/><path d="M233 104 L208 424"/><path d="M252 104 L256 424"/>
    <path d="M271 104 L304 424"/><path d="M290 104 L360 424"/>
  </g>
  <g stroke="#6b52a8" stroke-width="4" opacity="0.55">
    <path d="M206 160 L306 160"/><path d="M222 252 L328 252"/><path d="M243 348 L358 348"/>
  </g>
  <!-- note gems on the fire lane -->
  <g filter="url(#glow)">
    <rect x="216" y="132" width="74" height="30" rx="15" fill="#FFD93D"/>
    <rect x="188" y="228" width="92" height="38" rx="19" fill="#ff9f45"/>
    <rect x="238" y="326" width="116" height="48" rx="24" fill="url(#flame)"/>
  </g>
  <!-- hit line -->
  <path d="M108 420 L404 420" stroke="#ff9f45" stroke-width="30" stroke-linecap="round" opacity="0.35"/>
  <path d="M108 420 L404 420" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
</svg>
