<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15100a"/>
      <stop offset="55%" stop-color="#0b0b18"/>
      <stop offset="100%" stop-color="#07070f"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a855" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#d4a855" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d4a855" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <ellipse cx="540" cy="560" rx="430" ry="470" fill="url(#goldGlow)"/>

  <!-- Guitar icon (from icon.svg), scaled & centered. 24x40 native -> scale 11 -->
  <g transform="translate(408,300) scale(11)">
    <rect x="9" y="0" width="6" height="3" rx="1.5" fill="#c49030"/>
    <circle cx="8" cy="1" r="1" fill="#888"/>
    <circle cx="8" cy="2.5" r="1" fill="#888"/>
    <circle cx="16" cy="1" r="1" fill="#888"/>
    <circle cx="16" cy="2.5" r="1" fill="#888"/>
    <rect x="10.5" y="2.5" width="3" height="11" rx="1" fill="#c49030"/>
    <rect x="10" y="2.5" width="4" height="0.8" rx="0.4" fill="#e8d090"/>
    <path fill="#d4a855" fill-rule="evenodd" d="
      M 12 12 C 5 12 3.5 17 3.5 21 C 3.5 23.5 5 25 5 27
      C 5 29.5 2.5 32 2.5 36 C 2.5 38.5 7 40 12 40
      C 17 40 21.5 38.5 21.5 36 C 21.5 32 19 29.5 19 27
      C 19 25 20.5 23.5 20.5 21 C 20.5 17 19 12 12 12 Z
      M 7.5 27 a 1.2 3.5 0 1 0 2.4 0 a 1.2 3.5 0 1 0 -2.4 0
      M 14.1 27 a 1.2 3.5 0 1 0 2.4 0 a 1.2 3.5 0 1 0 -2.4 0 "/>
    <ellipse cx="12" cy="26" rx="2.5" ry="0.8" fill="none" stroke="#b08020" stroke-width="0.4" opacity="0.5"/>
    <line x1="11" y1="3" x2="9.5" y2="35" stroke="#c0c0c0" stroke-width="0.25" opacity="0.6"/>
    <line x1="11.6" y1="3" x2="10.5" y2="35" stroke="#c0c0c0" stroke-width="0.25" opacity="0.6"/>
    <line x1="12.2" y1="3" x2="11.5" y2="35" stroke="#c0c0c0" stroke-width="0.25" opacity="0.6"/>
    <line x1="12.8" y1="3" x2="12.5" y2="35" stroke="#c0c0c0" stroke-width="0.25" opacity="0.6"/>
    <line x1="13.4" y1="3" x2="13.5" y2="35" stroke="#c0c0c0" stroke-width="0.25" opacity="0.6"/>
    <line x1="14" y1="3" x2="14.5" y2="35" stroke="#c0c0c0" stroke-width="0.25" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="540" y="880" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
    font-size="104" font-weight="700" fill="#e8d8a0" letter-spacing="1">Jazz Guitar Lab</text>

  <!-- Tagline -->
  <text x="540" y="952" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="40" fill="#b8b8d8">Learn jazz harmony with a band</text>

  <!-- Tonal-center dots (R / 3 / 5 / 7) -->
  <g>
    <circle cx="453" cy="1034" r="15" fill="#FF6B6B"/>
    <circle cx="511" cy="1034" r="15" fill="#4ECDC4"/>
    <circle cx="569" cy="1034" r="15" fill="#74C0FC"/>
    <circle cx="627" cy="1034" r="15" fill="#FFD43B"/>
  </g>

  <!-- CTA -->
  <text x="540" y="1240" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="60" font-weight="700" fill="#d4a855">Free on the App Store</text>
  <text x="540" y="1314" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="40" fill="#9898bc">Pro unlocks once — no subscription</text>

  <!-- Vignette on top -->
  <rect width="1080" height="1920" fill="url(#vignette)"/>
</svg>
