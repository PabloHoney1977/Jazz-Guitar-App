workflows:
  ios-app-store:
    name: Jazz Guitar Lab — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Workflow-level (sibling of `environment`). This MUST match the App Store
    # Connect integration name created in Codemagic settings → Integrations.
    # With it set (+ ios_signing below), Codemagic auto-creates the distribution
    # cert AND provisioning profile at build time — fixes "No matching profiles".
    integrations:
      app_store_connect: JazzGuitarLab ASC

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pablohoney.jazzguitarlab
      # Add these 4 vars to a Codemagic variable group named EXACTLY
      # "appstore_credentials" (App settings → Environment variables):
      #   APP_STORE_APPLE_ID, APP_STORE_CONNECT_ISSUER_ID,
      #   APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
      # Mark them "Secure". The group reference below injects them into the build.
      groups:
        - appstore_credentials
      node: v22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web assets
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set build number from Codemagic
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))

      - name: Build and sign IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY     # set in Codemagic dashboard
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER   # set in Codemagic dashboard
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID     # set in Codemagic dashboard
        submit_to_testflight: true
        submit_to_app_store: false   # flip to true when ready for production
