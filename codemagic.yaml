workflows:
  ios-app-store:
    name: Jazz Guitar Lab — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Auto-build on every push to main (the live/served branch). Requires the
    # GitHub ↔ Codemagic webhook, which Codemagic installs when the app is first
    # connected in the dashboard. If builds still don't start on push, open the
    # app in Codemagic once and re-check the repository connection / webhook.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    # Workflow-level. Must match the App Store Connect integration name in
    # Codemagic settings → Integrations. Makes the API key available to the
    # `app-store-connect` CLI used in the "Set up code signing" script below.
    integrations:
      app_store_connect: Codemagic CI

    environment:
      # NOTE: deliberately NO `ios_signing:` block here. That triggers
      # Codemagic's built-in automatic signing, which only FETCHES existing
      # profiles and aborts before our scripts on a fresh account ("No matching
      # profiles found"). We do signing manually in the "Set up code signing"
      # step with --create, which generates the cert + profile from scratch.
      #
      # Add these vars to a Codemagic variable group named EXACTLY
      # "appstore_credentials" (App settings → Environment variables):
      #   APP_STORE_APPLE_ID, APP_STORE_CONNECT_ISSUER_ID,
      #   APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY,
      #   CERTIFICATE_PRIVATE_KEY  ← the RSA private key the distribution cert
      #                              is generated FROM (see "Set up code signing").
      # Mark them all "Secure". The group reference below injects them.
      groups:
        - appstore_credentials
      node: v22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web assets
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync ios

      # NOTE: no `pod install` — this Capacitor 8 project uses Swift Package
      # Manager (see ios/App/CapApp-SPM/Package.swift), not CocoaPods. There is
      # no Podfile; Xcode resolves the SPM packages automatically at build time.

      # Create the distribution certificate + provisioning profile via the
      # connected "Codemagic CI" integration. On a brand-new account there is NO
      # distribution certificate yet, and `fetch-signing-files --create` cannot
      # make one without a private key to build it from — hence the earlier
      # "Cannot save Signing Certificates without certificate private key" /
      # "Did not find any certificates". Passing --certificate-key generates the
      # cert FROM that key the first time, then REUSES the same cert on every
      # later build (the key is stable), so we never hit Apple's cert limit.
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.pablohoney.jazzguitarlab" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Set build number from Codemagic
        script: |
          cd ios/App
          # Query the highest build already on App Store Connect. The `|| echo 0`
          # guards against the API erroring OR the latest build still being in
          # "Processing" (which made this return 0 and re-upload build 1, a
          # duplicate-version collision). 2>/dev/null keeps a noisy error from
          # leaking into the captured number.
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$(($LATEST + 1))
          # $BUILD_NUMBER is Codemagic's monotonically-increasing build index;
          # it can never collide with an already-uploaded version. Use whichever
          # is higher so we're safe even when the API query lags or fails.
          if [ "${BUILD_NUMBER:-0}" -gt "$NEXT" ]; then NEXT=$BUILD_NUMBER; fi
          echo "Setting build number to $NEXT (ASC latest=$LATEST, Codemagic BUILD_NUMBER=${BUILD_NUMBER:-unset})"
          agvtool new-version -all "$NEXT"

      # Resolve the local Swift Package (CapApp-SPM) explicitly. Capacitor 8 uses
      # SPM, and build-ipa's hidden `-showBuildSettings` call fails ("status 74")
      # if packages aren't resolved first. Running it directly also prints the
      # REAL xcodebuild error to the log (the build-ipa wrapper hides it).
      - name: Resolve Swift packages
        script: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      - name: Build and sign IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY     # set in Codemagic dashboard
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER   # set in Codemagic dashboard
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID     # set in Codemagic dashboard
        submit_to_testflight: true
        submit_to_app_store: false   # flip to true when ready for production

  android-play:
    name: Jazz Guitar Lab — Google Play
    max_build_duration: 60
    # Linux, not a Mac mini: Android needs no macOS, and Linux minutes are the
    # cheap ones. Nothing here touches the iOS workflow above.
    instance_type: linux_x2

    # Deliberately NO `triggering:` block. A push to main already fires the iOS
    # workflow; auto-building Android on the same push would double the build
    # minutes for a store that releases on its own schedule. Start this one from
    # the Codemagic UI ("Start new build" → android-play). Add a `triggering:`
    # block matching the iOS one once the Play release cadence is worth it.

    environment:
      # Add to a Codemagic variable group named EXACTLY "google_play_credentials"
      # (App settings → Environment variables), marked Secure:
      #   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS ← the JSON key for a Google Cloud
      #     service account that has been invited in Play Console → Users and
      #     permissions with "Release to testing tracks" + "Release to production".
      #     Paste the whole JSON file contents as the value.
      groups:
        - google_play_credentials
      # The upload keystore, uploaded once in Codemagic → Teams/App settings →
      # Code signing identities → Android keystores, under this reference name.
      # ⚠️ BACK THE KEYSTORE UP OFF CODEMAGIC. Losing it means losing the ability
      # to sign updates for this listing; Play App Signing gives a recovery path
      # only if it was enrolled at first upload.
      android_signing:
        - jgl_upload_keystore
      java: 21
      node: v22

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web assets
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync android

      # Gradle finds the SDK through local.properties, which is gitignored (it
      # holds a machine-specific path), so CI has to write its own.
      - name: Point Gradle at the Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      # Play refuses an AAB whose versionCode isn't higher than the highest
      # already uploaded — across ALL tracks, including ones you've archived.
      # Same belt-and-braces shape as the iOS build-number step: ask Play, fall
      # back to Codemagic's monotonic index, take whichever is higher.
      - name: Set version code from Google Play
        script: |
          LATEST=$(google-play get-latest-build-number \
            --credentials "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" \
            --package-name "com.pablohoney.jazzguitarlab" \
            --tracks internal alpha beta production 2>/dev/null || echo 0)
          NEXT=$(($LATEST + 1))
          if [ "${PROJECT_BUILD_NUMBER:-0}" -gt "$NEXT" ]; then NEXT=$PROJECT_BUILD_NUMBER; fi
          echo "Setting versionCode to $NEXT (Play latest=$LATEST, Codemagic PROJECT_BUILD_NUMBER=${PROJECT_BUILD_NUMBER:-unset})"
          echo "JGL_VERSION_CODE=$NEXT" >> "$CM_ENV"

      # An .aab, not an .apk — Play has required App Bundles for new apps since
      # August 2021. The signing config reads the CM_KEYSTORE_* vars that the
      # android_signing block above exports (see android/app/build.gradle).
      - name: Build signed AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease -PjglVersionCode=$JGL_VERSION_CODE

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # Start on `internal` — it reaches testers in minutes and needs no
        # review. Promote to production from the Play Console when you're ready,
        # or change this to `production` once the flow is proven. `internal` is
        # also what a brand-new listing needs first: Play will not accept a
        # production release until the app has passed its initial review.
        track: internal
        submit_as_draft: false
