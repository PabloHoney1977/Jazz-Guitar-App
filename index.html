  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; font-size: 16px; }
    @media (min-width: 768px) { html { font-size: 19px; } }
    /* Guard against a page-level horizontal scrollbar on narrow iPhones. Every
       genuinely wide element (fretboard, chord rows, nav) has its OWN
       overflowX:auto scroll container, so clipping at the page level only stops
       stray overflow (e.g. the header chip cluster) — it never hides real
       horizontally-scrollable content. */
    html, body { overflow-x: hidden; max-width: 100%; }

    :root {
      --bg: #07070f; --bg2: #0d0d1e; --brd: #22223a;
      --lbl: #a8a8cc; --hint: #9898bc; --btn-off: #8888b8; --btn-brd: #28284a;
      --txt: #d0d0e8; --neck-wrap: #0b0b1c;
      --gold: #d4a855; --gold-txt: #d4a855; --scale-name: #e8d8a0;
      --cb-bg: #09091a; --cb-sel: #09182a; --cb-str: #1e1e38;
      --scale-circ: rgba(255,255,255,0.04); --scale-circ-str: rgba(255,255,255,0.20);
      --scale-circ-txt: rgba(255,255,255,0.26); --hi-dot-str: rgba(255,255,255,0.85);
      /* Chord-tone dots are filled with the bright TC pastels in BOTH themes,
         so the label must be dark for legible contrast (white-on-gold was ~1.4:1
         and failed WCAG; dark-on-pastel is ~9-12:1). */
      --dot-lbl: #14142a;
      --leg-circ: rgba(255,255,255,0.28); --leg-txt: rgba(255,255,255,0.45);
      --parent-key: #4ECDC4; --parent-key-brd: #4ECDC440; --parent-other: #9090c0;
      --parent-box-act: #0a1f1f;
      --note-non-chord: rgba(255,255,255,0.04); --note-non-chord-txt: #6060a0; --note-iv-txt: #484870;
      --act-gold: #1a1402; --act-red: #1a0808; --act-teal: #081a1a;
      --act-blue: #081520; --act-pur: #1a0a28; --act-yel: #181200;
      --neck-wood1: #2a1e0c; --neck-wood2: #1c1408; --neck-wood3: #120f04;
      --neck-edge: #3a2a10; --neck-fret: #2e2010; --neck-fret12: #4a3520;
      --neck-inlay: #2e2010; --neck-lbl: #9a8850;
      /* chord-tone dim fills for arpPos dots — semi-transparent in dark mode */
      --tc-dim-0: #FF6B6B55; --tc-dim-1: #4ECDC455;
      --tc-dim-2: #74C0FC55; --tc-dim-3: #FFD43B55;
      /* LedToggle label text — bright pastels read fine on the dark bg */
      --led-bass-fg: #74C0FC; --led-guitar-fg: #86EFAC; --led-ride-fg: #FFD43B;
      /* Accent colours used as TEXT. The bright hexes above are dot/glow/border
         colours: as label text on the light background they fall to ~1.2:1, far
         under WCAG AA. Every accent-coloured label routes through these instead,
         so dots stay vivid while text stays readable in both themes. Dark mode
         keeps the bright values; the light block darkens each to >= 4.5:1. */
      --tc-txt-0: #FF6B6B; --tc-txt-1: #4ECDC4;
      --tc-txt-2: #74C0FC; --tc-txt-3: #FFD43B;
      --acc-red: #FF6B6B; --acc-teal: #4ECDC4; --acc-blue: #74C0FC;
      --acc-amber: #FFD43B; --acc-green: #86EFAC; --acc-purple: #C084FC;
      --acc-orange: #F4A261; --acc-warn: #F97316;
    }
    :root[data-theme="light"] {
      --bg: #f5f5fa; --bg2: #eaeaf5; --brd: #b8b8d8;
      --lbl: #363663; --hint: #525285; --btn-off: #3d3d65; --btn-brd: #b8b8d8;
      --txt: #0e0e20; --neck-wrap: #e8e4de;
      --gold: #b07418; --gold-txt: #8a5a10; --scale-name: #5a3a00;
      --cb-bg: #ffffff; --cb-sel: #ddf0fa; --cb-str: #a8a8c8;
      --scale-circ: rgba(0,0,0,0.06); --scale-circ-str: rgba(0,0,0,0.22);
      --scale-circ-txt: rgba(0,0,0,0.50); --hi-dot-str: rgba(0,0,0,0.70);
      --dot-lbl: #1a1a2e;
      --leg-circ: rgba(0,0,0,0.28); --leg-txt: rgba(0,0,0,0.65);
      --parent-key: #0b6e66; --parent-key-brd: rgba(78,205,196,0.35); --parent-other: #484890;
      --parent-box-act: #d0f0ee;
      --note-non-chord: rgba(0,0,0,0.07); --note-non-chord-txt: #505090; --note-iv-txt: #6060a0;
      --act-gold: #fff8e0; --act-red: #ffe8e8; --act-teal: #d8f5f0;
      --act-blue: #e0eefa; --act-pur: #f5e0fc; --act-yel: #fffbe0;
      --neck-wood1: #c8a870; --neck-wood2: #b89050; --neck-wood3: #a07830;
      --neck-edge: #8a6030; --neck-fret: #7a5828; --neck-fret12: #9a7040;
      --neck-inlay: #7a5828; --neck-lbl: #5a4010;
      /* chord-tone dim fills — darker, more opaque so they read on warm wood */
      --tc-dim-0: rgba(200,40,40,0.82);  /* root: dark red   */
      --tc-dim-1: rgba(15,148,138,0.82); /* 3rd:  dark teal  */
      --tc-dim-2: rgba(30,108,195,0.82); /* 5th:  dark blue  */
      --tc-dim-3: rgba(172,108,0,0.85);  /* 7th:  dark amber */
      /* LedToggle label text — darkened so it stays legible on the light bg
         (the bright pastels failed contrast — see screenshot report) */
      --led-bass-fg: #1a5fae; --led-guitar-fg: #1b6b2f; --led-ride-fg: #7a4d00;
      /* Accent-as-text, darkened. Each measured >= 4.5:1 against --bg2 (#eaeaf5),
         the lightest surface any of them sits on, so they clear WCAG AA at the
         small sizes these labels actually use. Do NOT swap these back to the
         bright hexes — those are for dots, glows and borders only. */
      --tc-txt-0: #b71c1c; --tc-txt-1: #0b6e66;
      --tc-txt-2: #1a5fae; --tc-txt-3: #8a5600;
      --acc-red: #b71c1c; --acc-teal: #0b6e66; --acc-blue: #1a5fae;
      --acc-amber: #8a5600; --acc-green: #1b6b2f; --acc-purple: #7c3aed;
      --acc-orange: #8f4d0c; --acc-warn: #b3480a;
    }

    body {
      background: var(--bg);
      color: var(--txt);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      min-height: 44px;
      touch-action: manipulation;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--brd); border-radius: 2px; }
    /* viewport-fit=cover lets content fill the screen edge-to-edge, so we must
       inset the app below the status bar / notch (top) and above the home
       indicator (bottom) ourselves via the safe-area-inset env() values.
       The header scrolls with the content (it is not position:fixed), so the
       top inset belongs on #root; fixed overlays/nav position against the
       viewport and are unaffected by this padding. */
    #root { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    @keyframes barPulse {
      0%   { box-shadow: inset 0 0 0 1px var(--gold); }
      50%  { box-shadow: inset 0 0 0 2px var(--gold), 0 0 8px 1px rgba(212,168,85,0.35); }
      100% { box-shadow: inset 0 0 0 1px var(--gold); }
    }
    @keyframes doneFlash {
      0%   { transform: scale(1);   opacity: 1; }
      40%  { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(1);   opacity: 1; }
    }
    @keyframes streakPop {
      0%   { transform: scale(1);    box-shadow: none; }
      30%  { transform: scale(1.25); box-shadow: 0 0 10px 3px rgba(255,180,0,0.55); }
      70%  { transform: scale(1.12); box-shadow: 0 0 6px 2px rgba(255,180,0,0.3); }
      100% { transform: scale(1);    box-shadow: none; }
    }
    @keyframes milestoneUp {
      0%   { transform: translateY(100%); opacity: 0; }
      18%  { transform: translateY(-6px);  opacity: 1; }
      26%  { transform: translateY(0);     opacity: 1; }
      74%  { transform: translateY(0);     opacity: 1; }
      100% { transform: translateY(100%);  opacity: 0; }
    }
    /* Respect the OS "reduce motion" setting (vestibular accessibility):
       collapse animations/transitions to near-instant but still let content
       appear (milestone/tour panels remain functional, just without movement). */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
